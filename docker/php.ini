; Mnemon's PHP settings, copied into the image's conf.d. The FrankenPHP base
; ships no php.ini, so without this PHP's built-in defaults apply: a 2 MB
; upload limit and an 8 MB request limit, too small for document uploads.

; Above MNEMON_DOCUMENT_MAX_MB (25 by default), so Mnemon's own limit is the
; one a person meets, with its clearer message. document_add sends a file as
; base64 in a JSON request, a third larger than the file.
upload_max_filesize = 64M
post_max_size = 64M

; Parsing a large PDF or a deck holds the document in memory several times
; over.
memory_limit = 512M
